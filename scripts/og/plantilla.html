<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Poppins';font-weight:700;src:url(../../assets/fonts/Poppins-700.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:400;src:url(../../assets/fonts/Poppins-400.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:600;src:url(../../assets/fonts/JetBrainsMono-600.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(../../assets/fonts/JetBrainsMono-400.woff2) format('woff2')}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#0c1210;color:#e6f0ea;font-family:Poppins,sans-serif;display:grid;grid-template-columns:520px 680px;overflow:hidden}
.t{padding:54px 40px 44px 56px;display:flex;flex-direction:column;gap:18px}
.marca{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px}
.marca img{height:34px}
.marca i{font-style:normal;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.2em;color:#00c896;text-transform:uppercase;display:block}
h1{font-size:46px;line-height:1.08;letter-spacing:-.02em;margin-top:18px}
.k{font-family:'JetBrains Mono';font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#8ea59b;margin-top:auto}
.big{font-family:'JetBrains Mono';font-weight:600;font-size:76px;color:#00c896;line-height:1}
.big small{font-size:30px;color:#e6f0ea;font-weight:400;margin-left:8px}
.prod{font-family:'JetBrains Mono';font-size:19px;color:#e6f0ea;margin-top:-6px}
.pie{font-size:17px;color:#8ea59b}
.pie b{color:#e6f0ea;font-weight:400}
.e{position:relative;overflow:hidden;border-left:1px solid #223029}
.e img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style></head>
<body>
<div class="t">
  <div class="marca"><img src="../../assets/logo-mark.png" alt=""><span>food&amp;farm<i>analytics</i></span></div>
  <h1>¿Cuánto producto echo en la cuba?</h1>
  <div class="k" id="k">producto en cada cuba</div>
  <div class="big" id="big"></div>
  <div class="prod" id="prod"></div>
  <p class="pie"><b>Dosis autorizadas del MAPA</b>, cubas, boquillas y orden de tratamiento. Gratis.</p>
</div>
<div class="e"><img id="esc" alt=""></div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('esc').src = q.get('img');
const [n, u] = (q.get('kg') || '').split(' ');
document.getElementById('big').innerHTML = `${n}<small>${u}</small>`;
document.getElementById('prod').textContent = `de ${q.get('prod') || ''} en 2.000 L de agua`;
</script>
</body></html>
