<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inteligencia · Food & Farm Analytics</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://fnfanalytics.com/#inteligencia">
<style>
@font-face{font-family:'Poppins';font-weight:400;font-display:swap;src:url(/assets/fonts/Poppins-400.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:600;font-display:swap;src:url(/assets/fonts/Poppins-600.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:700;font-display:swap;src:url(/assets/fonts/Poppins-700.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-display:swap;src:url(/assets/fonts/JetBrainsMono-400.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:600;font-display:swap;src:url(/assets/fonts/JetBrainsMono-600.woff2) format('woff2')}
</style>
<style>
/* Layout: sala de control (tema oscuro único, a propósito). Fuentes digitales a la izquierda, la finca en 3D
   con los sensores que ya tiene montados en el centro, y el razonamiento de la IA a la derecha. En móvil, apilado. */
:root{
  --bg:#0c1210; --panel:#111917; --panel-2:#18231f; --line:#223029; --line-2:#31443b;
  --ink:#e6f0ea; --soft:#8ea59b; --brand:#00c896; --brand-2:#2fe0b0; --warn:#e0a33e; --sky:#6fa8f0;
  --font:'Poppins',ui-sans-serif,system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:1380px;margin:0 auto;padding-inline:20px;padding-block:36px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.flag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);border:1px solid var(--line-2);border-radius:4px;padding:4px 8px}
h1{font-size:clamp(1.8rem,4vw,3rem);line-height:1.08;letter-spacing:-.02em;margin:.35em 0 .3em;max-width:22ch;text-wrap:balance}
h1 em{font-style:normal;color:var(--brand)}
.lede{color:var(--soft);max-width:74ch;margin:0}

.stage{position:relative;margin-top:28px;display:grid;grid-template-columns:230px minmax(0,1fr) 340px;grid-template-rows:760px auto;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.cards{padding:12px 10px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);z-index:2;background:linear-gradient(90deg,var(--bg),rgba(12,18,16,.6))}
.grupo{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:2px 2px 0}
.card{position:relative;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);padding:6px 9px;opacity:.3;transition:opacity .4s,border-color .3s,background .3s}
.card.on{opacity:1}
.card.hot{border-color:var(--warn);background:var(--panel-2)}
.card .c{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.card b{display:block;font-size:12.5px;font-weight:600;line-height:1.2}
.card .v{display:block;font-family:var(--mono);font-size:10px;line-height:1.35;color:var(--soft)}
.card.hot .v{color:var(--warn)}
.card::after{content:"";position:absolute;right:8px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.card.on::after{background:var(--brand)}
.card.hot::after{background:var(--warn)}

.escena{position:relative;min-width:0;min-height:0;overflow:hidden;border-right:1px solid var(--line)}
.cards,.ia{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.escena canvas{position:absolute;inset:0}
.escena canvas{display:block;width:100%;height:100%}
.chip{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;border:1px solid var(--line-2);border-radius:5px;background:rgba(17,25,23,.9);padding:5px 8px;white-space:nowrap;opacity:0;transition:opacity .4s,border-color .3s}
.chip.on{opacity:1}
.chip .t{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.chip .t.pub{color:var(--sky)}
.chip b{display:block;font-size:12px;font-weight:600}
.chip .v{font-family:var(--mono);font-size:10.5px;color:var(--soft)}
.chip.hot{border-color:var(--warn);z-index:2}
.chip.mini{padding:2px 6px}.chip.mini .t,.chip.mini .v{display:none}.chip.mini b{font-size:10.5px;color:var(--soft);font-weight:400}
.chip.mini.hot b{color:var(--warn);font-weight:600}
.chip.hot .v{color:var(--warn)}
.hud{position:absolute;left:14px;top:12px;display:flex;gap:16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);pointer-events:none}
.hud b{color:var(--ink);font-weight:600}
.leyenda{position:absolute;left:14px;bottom:12px;display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--soft);pointer-events:none}
.leyenda i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg.beams{position:absolute;inset:0;pointer-events:none;z-index:1}
.beam{fill:none;stroke:var(--line-2);stroke-width:1.2;opacity:0;transition:opacity .4s}
.beam.on{opacity:.9}
.beam.hot{stroke:var(--warn);stroke-width:2}
.bdot{fill:var(--brand)}
.bdot.hot{fill:var(--warn)}
.explora{position:absolute;right:12px;top:10px;z-index:3;display:flex;gap:6px;align-items:center}
.explora[hidden],.explora [hidden]{display:none}
.explora button{font:inherit;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:rgba(17,25,23,.92);border:1px solid var(--line-2);border-radius:4px;padding:7px 10px;cursor:pointer}
.explora button:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.explora .ir{border-color:var(--brand);color:var(--brand)}
.explora .z{width:32px;padding:6px 0;font-size:15px;line-height:1}
.explora .pista{position:absolute;right:0;top:calc(100% + 6px);white-space:nowrap;font-family:var(--mono);font-size:10px;color:var(--soft);background:rgba(17,25,23,.92);border-radius:4px;padding:6px 8px}
.explora .ir span[aria-hidden]{font-size:13px}
svg.beams.mapa{opacity:0;transition:opacity .4s}
.chip.fuera{opacity:0}
.chip.nombre{background:none;border:0;padding:0;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink);text-shadow:0 1px 3px #000,0 0 8px #000;z-index:0}
html.grande,html.grande body{overflow:hidden}
html.grande .escena{position:fixed;inset:0;z-index:50;height:auto!important;border:0;background:var(--bg)}
html.grande .escena canvas{touch-action:none}
html.grande svg.beams{display:none}
.escena.explorando canvas{cursor:grab}
.escena.explorando.sobre canvas{cursor:pointer}
.escena.arrastrando canvas{cursor:grabbing}
.chip.tip{z-index:3;border-color:var(--brand)}

.ia{padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0;background:linear-gradient(var(--panel),var(--bg));z-index:2}
.ia-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{font-family:var(--mono);font-size:10.5px;color:var(--soft)}
.st i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line-2);margin-right:6px;vertical-align:middle}
.st.run i{background:var(--brand);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.pasos{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:13.5px}
.pasos li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s}
.pasos li.on{opacity:1;transform:none}
.pasos .n{font-family:var(--mono);font-size:11px;color:var(--warn);padding-top:2px}
.cita{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--sky);border:1px solid #2b4a74;border-radius:3px;padding:0 5px;margin:2px 4px 0 0}
.cita.prop{color:var(--brand);border-color:#145a46}
.decision{border:1px solid var(--warn);border-radius:8px;padding:14px;background:rgba(224,163,62,.07);display:grid;gap:10px;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.decision.on{opacity:1;transform:none}
.decision .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--warn)}
.decision h3{margin:0;font-size:1.12rem;line-height:1.3;letter-spacing:-.01em}
.decision p{margin:0;font-size:12.5px;color:var(--soft)}
.acciones{display:grid;gap:8px}
.btn{font:inherit;font-size:13.5px;font-weight:600;border-radius:6px;padding:10px 12px;cursor:pointer;text-align:left;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn.p{background:var(--brand);border-color:var(--brand);color:#052018}
.btn small{font-family:var(--mono);font-size:10.5px;font-weight:400;opacity:.8;white-space:nowrap}
.btn:focus-visible,.again:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:10.5px;color:var(--soft)}
.meta b{color:var(--ink);font-weight:600}
.again{align-self:flex-start;font:inherit;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);background:none;border:1px solid var(--line-2);border-radius:4px;padding:6px 10px;cursor:pointer}
.toast{font-family:var(--mono);font-size:11px;color:var(--brand)}
/* «Pruébalo»: escenarios, la causa que se mueve y la frase que se recalcula. Fija arriba del panel mientras se lee */
.prueba{position:sticky;top:-18px;margin:0 -18px;padding:10px 18px 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:1;display:grid;gap:10px}
.escs{display:flex;flex-wrap:wrap;gap:6px}
.escs button{font:inherit;font-size:12px;font-weight:600;color:var(--soft);background:var(--panel-2);border:1px solid var(--line-2);border-radius:999px;padding:5px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.escs button[aria-pressed=true]{color:var(--ink);border-color:var(--brand);background:rgba(0,200,150,.12)}
.escs button:focus-visible,.causa input:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
kbd{font-family:var(--mono);font-size:9.5px;font-weight:400;color:var(--soft);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;line-height:1.4}
@media (hover:none){kbd{display:none}}
.causa{display:grid;gap:4px}
.causa label{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.causa output{color:var(--ink);font-weight:600}
.causa input{width:100%;height:24px;margin:0;accent-color:var(--brand);cursor:pointer}
.frase{margin:0;font-size:12.5px;line-height:1.45}
.fases{list-style:none;margin:0;padding:0;display:flex;gap:4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.fases li{flex:1;text-align:center;padding:4px 0;border:1px solid var(--line-2);border-radius:3px;color:var(--soft)}
.fases li.on{color:var(--warn);border-color:var(--warn);background:rgba(224,163,62,.12)}
.fases li.on[data-f=actuar]{color:#2a1a04;background:var(--warn)}
.fases li.on[data-f=normal],.fases li.on[data-f=hecho]{color:#052018;background:var(--brand);border-color:var(--brand)}
.decision.ok{border-color:#145a46;background:rgba(0,200,150,.06)}
.decision.ok .k{color:var(--brand)}
.hud .a b{color:var(--warn)}
/* al probar, la decisión sube justo debajo de la frase y los pasos quedan debajo, como el porqué */
.ia.vivo .decision{order:1}.ia.vivo .pasos{order:2}.ia.vivo .again{order:3}
.cifras{display:flex;gap:inherit}

.salidas{grid-column:1/-1;border-top:1px solid var(--line);padding:16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;background:var(--panel)}
.sal-head{grid-column:1/-1;display:flex;gap:12px;align-items:baseline}
.sal-head .sub{font-family:var(--mono);font-size:10.5px;color:var(--soft)}
.salida{border:1px solid var(--line-2);border-radius:8px;padding:12px;background:var(--bg);display:grid;gap:8px;align-content:start;opacity:.25;transform:translateY(6px);transition:opacity .5s,transform .5s,border-color .5s}
.salida.on{opacity:1;transform:none;border-color:#145a46}
.salida .c{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.salida b{font-size:13.5px;font-weight:600}
.salida .pie{font-family:var(--mono);font-size:10px;color:var(--soft)}
.salida.on .riego{display:flex;align-items:flex-end;gap:10px;height:70px}
.riego i{flex:1;position:relative;height:100%;display:flex;align-items:flex-end;font-style:normal}
.riego i::before{content:"";width:100%;height:0;background:#2b4a74;border-radius:2px 2px 0 0;transition:height .9s .2s}
.salida.on .riego i::before{height:var(--h)}
.riego i.w::before{background:var(--sky)}
.riego span{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--soft)}
.salida .riego + .pie{margin-top:14px}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:12px}
.lista em{font-style:normal;color:var(--brand);margin-right:6px}
.spark{width:100%;height:50px}
.spark .m{fill:none;stroke:var(--line-2);stroke-width:2;stroke-dasharray:4 3}
.spark .s{fill:none;stroke:var(--warn);stroke-width:2.2;stroke-dasharray:300;stroke-dashoffset:300;transition:stroke-dashoffset 1.4s .2s}
.salida.on .spark .s{stroke-dashoffset:0}
@media (max-width:1100px){.salidas{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){
  .salidas{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:84%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .sal-head{grid-column:auto;grid-row:1;flex-direction:column;gap:2px}
  .salida{grid-row:2;scroll-snap-align:start}
  .cards:not(.todas) .extra:not(.hot){display:none}
  .mas{display:block}
}
.mas{display:none;grid-column:1/-1;justify-self:start;font:inherit;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);background:none;border:1px solid var(--line-2);border-radius:4px;padding:6px 10px;cursor:pointer}
@media (max-width:1100px){
  .stage{grid-template-columns:minmax(0,1fr)}
  /* el panel de la IA justo debajo de la finca: al mover el control se ven los dos */
  .cards{order:1}.salidas{order:2}
  .stage{grid-template-rows:none}
  .cards,.ia{overflow:visible}
  .escena{order:-1;min-height:0;height:440px;border-right:0;border-bottom:1px solid var(--line)}
  .cards{border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .grupo{grid-column:1/-1}
  svg.beams{display:none}
}
@media (max-width:560px){.explora{top:auto;bottom:12px}.explora .pista{top:auto;bottom:calc(100% + 6px)}.explora .txt{display:none}.escena{height:360px}.chip{padding:3px 6px}.chip b{font-size:10.5px}.chip .v{font-size:9.5px}.hud{gap:10px;letter-spacing:.04em}#reloj{display:none}.leyenda{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
html,body{background:transparent}
</style>
</head>
<body>
<div class="wrap" style="padding:0">
  <section class="stage" id="stage" style="margin-top:0" aria-label="Animación: fuentes y sensores, la finca en 3D y la decisión">
    <svg class="beams" id="beams" aria-hidden="true"></svg>
    <div class="cards" id="cards"></div>
    <div class="escena" id="escena" role="img" aria-label="Una explotación en 3D: seis parcelas de ciruelos y otras cuatro de tomate, maíz, viña y olivar, en hileras; la parcela El Cercado con árboles más pequeños y en naranja; los sensores sobre el terreno y un tractor que atomiza Las Suertes.">
      <div class="hud"><span class="cifras" id="cifras"></span><span id="reloj">08:14:07</span></div>
      <div class="leyenda"><span><i style="background:#4a8530"></i>vigor alto</span><span><i style="background:#6a8034"></i>vigor medio</span><span><i style="background:#e0a33e"></i>en alerta</span><span>tamaño de copa = NDVI</span></div>
      <div class="explora" id="explora"><span class="pista" id="pista" role="status" hidden></span><button type="button" id="saltar" hidden>Saltar al final</button><button type="button" class="z" id="izq" aria-label="Girar a la izquierda" title="Girar a la izquierda">↶</button><button type="button" class="z" id="der" aria-label="Girar a la derecha" title="Girar a la derecha">↷</button><button type="button" class="z" id="inicio" aria-label="Volver a la vista inicial" title="Vista inicial" hidden>⌂</button><button type="button" class="z" id="zmas" aria-label="Acercar">+</button><button type="button" class="z" id="zmenos" aria-label="Alejar">−</button><button type="button" class="ir" id="grande" aria-label="Ver en grande"><span aria-hidden="true">⤢</span><span class="txt"> Ver en grande</span></button><button type="button" class="ir" id="cerrar" hidden>✕ Salir</button></div>
    </div>
    <aside class="ia">
      <div class="ia-head"><span class="label">IA · razonamiento</span><span class="st" id="st" aria-live="polite"><i></i>esperando datos</span></div>
      <div class="prueba">
        <div class="escs" id="escs" role="group" aria-label="Escenario">
          <button type="button" data-esc="calor" aria-pressed="true">Ola de calor <kbd>1</kbd></button>
          <button type="button" data-esc="normal" aria-pressed="false">Semana normal <kbd>2</kbd></button>
          <button type="button" data-esc="otono" aria-pressed="false">Lluvia de otoño <kbd>3</kbd></button>
        </div>
        <div class="causa" id="causa-box" hidden>
          <label for="causa"><span id="causa-t">Días sin regar</span><output id="causa-v" for="causa"></output></label>
          <input type="range" id="causa" min="0" max="14" step="1" value="9">
          <p class="frase" id="frase" aria-live="polite"></p>
        </div>
      </div>
      <ol class="pasos" id="pasos" aria-live="polite"></ol>
      <div class="decision" id="decision"></div>
      <button type="button" class="again" id="again">Ver de nuevo</button>
    </aside>
    <div class="salidas" id="salidas">
      <div class="sal-head"><span class="label">Salidas</span><span class="sub">lo que se actualiza solo con cada decisión</span></div>
    </div>
  </section>
</div>

<script src="/assets/vendor/three-r128.min.js"></script>
<script>
(() => {

    const wpp = 2 * G.dist * Math.tan(cam.fov * Math.PI / 360) / escena.clientHeight, f = wpp / Math.max(.45, Math.cos(G.incl));
    const sg = Math.sin(G.giro), cg = Math.cos(G.giro), mx = -cg * dx * wpp - sg * dy * f, mz = sg * dx * wpp - cg * dy * f;
    G.x += mx; G.z += mz; C.x += mx; C.z += mz; ajustar(G); ajustar(C); redraw();
  }
  function girar(dg, di) { tomar(); G.giro += dg; C.giro += dg; G.incl += di; ajustar(G); C.incl = G.incl; redraw(); }
  // acercar hacia un punto de la pantalla, como en un mapa
  function acercar(f, cx, cy) {
    tomar();
    const d = Math.min(LIM.dmax, Math.max(LIM.dmin, G.dist * f)), q = d / G.dist;
    if (cx !== undefined) { apuntar(cx, cy); const p = ray.ray.intersectPlane(plano, new THREE.Vector3()); if (p) { G.x = p.x + (G.x - p.x) * q; G.z = p.z + (G.z - p.z) * q; } }
    G.dist = d; ajustar(G); redraw();
  }
  // tocar un sensor o una parcela: la cámara vuela hasta él
  function volar(sel) {
    if (!sel || sel === 'sat') return;
    const [x, z] = sel[0] === 'p' ? parcelas[+sel.slice(1)].c : sel[0] === 'w' ? GENTE[+sel.slice(1)].sitio : [objetos[sel].a.x, objetos[sel].a.z];
    tomar(); Object.assign(G, {x, z, dist:Math.min(G.dist, 6)}); ajustar(G); U.rapidez = 3; redraw();
  }
  let grande = false;
  function ponerGrande(on) {
    grande = on; document.documentElement.classList.toggle('grande', on);
    $('grande').hidden = on; $('cerrar').hidden = !on;
    if (window.parent !== window) parent.postMessage({ig:'grande', on}, location.origin);
    if (on) { tomar(); avisa('ig-grande'); pista(fino ? 'Arrastra para moverte · Mayús + arrastrar gira · rueda acerca' : 'Un dedo mueve · dos dedos acercan y giran'); $('cerrar').focus(); }
    else { pista(''); $('grande').focus({preventScroll:true}); }
  }
  addEventListener('keydown', e => { if (e.key === 'Escape' && grande) ponerGrande(false); });
  addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.ig === 'salir' && grande) ponerGrande(false); });
  $('grande').addEventListener('click', () => ponerGrande(true));
  $('cerrar').addEventListener('click', () => ponerGrande(false));
  $('inicio').addEventListener('click', vistaInicial);
  // girar con botones: un octavo de vuelta, suavizado (con trackpad, arrastrar con el botón derecho no es cómodo)
  const rotar = d => { tomar(); G.giro += d; U.rapidez = 5; redraw(); };
  $('izq').addEventListener('click', () => rotar(-Math.PI / 4));
  $('der').addEventListener('click', () => rotar(Math.PI / 4));
  $('zmas').addEventListener('click', () => acercar(.7));
  $('zmenos').addEventListener('click', () => acercar(1.4));
  if (R) {
    const cv = R.domElement; escena.classList.add('explorando');
    // ratón o lápiz: arrastrar mueve; con el botón derecho, Mayús, Ctrl o ⌘, gira e inclina
    cv.addEventListener('contextmenu', ev => ev.preventDefault());
    cv.addEventListener('pointerdown', ev => {
      if (ev.pointerType === 'touch') { U.toque = {x:ev.clientX, y:ev.clientY, gesto:false}; return; }
      U.drag = {x:ev.clientX, y:ev.clientY, mov:0, girar:ev.button === 2 || ev.shiftKey || ev.ctrlKey || ev.metaKey || ev.altKey};
      cv.setPointerCapture(ev.pointerId); escena.classList.add('arrastrando');
    });
    cv.addEventListener('pointermove', ev => {
      if (U.drag) {
        const dx = ev.clientX - U.drag.x, dy = ev.clientY - U.drag.y; U.drag.x = ev.clientX; U.drag.y = ev.clientY; U.drag.mov += Math.abs(dx) + Math.abs(dy);
        // la tecla puede pulsarse ya empezado el arrastre
        if (U.drag.mov > 4) U.drag.girar || ev.shiftKey || ev.altKey ? girar(-dx * .006, -dy * .004) : mover(dx, dy);
      } else if (ev.pointerType === 'mouse') elegir(pick(ev));
    });
    const soltar = () => { U.drag = null; escena.classList.remove('arrastrando'); };
    cv.addEventListener('pointerup', ev => {
      const d = U.drag, t = U.toque; soltar(); U.toque = null;
      // un toque o un clic sin arrastrar elige lo que hay debajo y vuela hasta ello
      const toque = ev.pointerType === 'touch' ? t && !t.gesto && Math.hypot(ev.clientX - t.x, ev.clientY - t.y) < 8 : d && d.mov <= 4;
      if (toque && E.final) { const sel = pick(ev); elegir(sel); volar(sel); }
    });
    cv.addEventListener('pointercancel', () => { soltar(); U.toque = null; });
    cv.addEventListener('pointerleave', ev => { if (!U.drag && ev.pointerType === 'mouse') elegir(null); });
    cv.addEventListener('wheel', ev => {
      if (!(ev.ctrlKey || ev.metaKey || grande)) { pista(`${mac ? '⌘' : 'Ctrl'} + rueda para acercar`); return; }
      ev.preventDefault(); acercar(Math.exp(ev.deltaY * (ev.deltaMode ? .1 : .004)), ev.clientX, ev.clientY);
    }, {passive:false});
    // dedos: en la portada, uno baja la página y dos mueven, acercan y giran; en grande, uno ya mueve
    let T = null;
    const medir = ts => { const a = ts[0], b = ts[1] || ts[0];
      return {n:ts.length, x:(a.clientX + b.clientX) / 2, y:(a.clientY + b.clientY) / 2, d:Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1, a:Math.atan2(b.clientY - a.clientY, b.clientX - a.clientX)}; };
    cv.addEventListener('touchstart', ev => { if (ev.touches.length > 1 || grande) { ev.preventDefault(); T = medir(ev.touches); if (U.toque) U.toque.gesto = ev.touches.length > 1; } }, {passive:false});
    cv.addEventListener('touchmove', ev => {
      if (ev.touches.length < 2 && !grande) { if (E.final && !U.on) pista('Usa dos dedos para mover la finca'); return; }
      if (!ev.cancelable) return; ev.preventDefault();
      const m = medir(ev.touches);
      if (T && T.n === m.n) {
        mover(m.x - T.x, m.y - T.y);
        if (m.n > 1) { acercar(T.d / m.d, m.x, m.y); const da = Math.atan2(Math.sin(m.a - T.a), Math.cos(m.a - T.a)); girar(da, 0); }
      }
      if (U.toque && (m.n > 1 || Math.hypot(m.x - U.toque.x, m.y - U.toque.y) > 8)) U.toque.gesto = true;
      T = m;
    }, {passive:false});
    cv.addEventListener('touchend', ev => { T = ev.touches.length ? medir(ev.touches) : null; });
    cv.addEventListener('touchcancel', () => { T = null; });
  }

  // ---- lo que cambia con el escenario: fuentes, cifras, El Cercado, pasos, decisión y salidas ----
  function ponerFuentes(ev) {
    Object.entries(FUENTES).forEach(([k, f]) => { if (k === 'tractor') return; f.v = ev.v[k] || f.v0; const v = f.el.querySelector('.v'); if (v) v.textContent = f.v; });
  }
  function ponerCifras(ev) {
    $('cifras').innerHTML = ev.cifras.map(([l, v, a]) => `<span${a ? ' class="a"' : ''}>${l} <b>${v}</b></span>`).join('');
  }
  function ponerCercado(ev) {
    NDVI[ALERTA] = ev.ndvi; pintar(cer, ev.ndvi, ev.alerta);
    etiq.innerHTML = `<span class="t" style="color:var(--${ev.alerta ? 'warn' : 'brand'})">${ev.etiq[0]}</span><b>El Cercado</b><span class="v">${ev.etiq[1]}</span>`;
  }
  function ponerCausa() {
    const c = CAUSA[ESC[P.esc].causa], r = $('causa');
    $('causa-t').textContent = c.t; r.max = c.max; r.value = P.v; $('causa-v').textContent = c.u(P.v);
  }
  const paso = (t, refs, i) => `<span class="n">${String(i + 1).padStart(2, '0')}</span><span>${t}<br>${refs.map(r => `<span class="cita${FUENTES[r].obj && !FUENTES[r].pub ? ' prop' : ''}">${FUENTES[r].n}</span>`).join('')}</span>`;
  function ponerDecision(ev) {
    const d = ev.dec, el = $('decision');
    el.classList.toggle('ok', !!d.ok);
    el.innerHTML = `<ol class="fases" id="fases" aria-label="Fase">${['normal', 'vigilar', 'actuar', 'hecho'].map(f => `<li data-f="${f}">${f}</li>`).join('')}</ol>` +
      `<span class="k">${d.k}</span><h3>${d.h}</h3><p>${d.p}</p>` +
      (d.acc.length ? `<div class="acciones">${d.acc.map((a, i) => `<button type="button" class="btn${a.p ? ' p' : ''}" data-i="${i}">${a.t} <small>${a.s}</small></button>`).join('')}</div>` : '') +
      `<span class="toast" id="toast" role="status"></span><div class="meta"><span>confianza <b>alta</b></span><span>fuentes <b>${ev.refs.length} de 17</b></span><span>avisado <b>${d.aviso}</b></span></div>`;
    ponerFase();
  }
  function ponerFase() {
    const f = P.hecho ? 'hecho' : EV.fase;
    document.querySelectorAll('#fases li').forEach(li => { li.classList.toggle('on', li.dataset.f === f); li.setAttribute('aria-current', li.dataset.f === f ? 'step' : 'false'); });
  }
  // NDVI de El Cercado frente a su media: la línea se separa más cuanto más cae el vigor
  const MEDIA = [34, 30, 26, 20, 16, 14, 17, 21, 24], SEP = [1, 1, 1, 2, 2, 5, 10, 13, 16];
  function ponerSalidas(ev, on) {
    const s = ev.sal, li = xs => xs.map(([m, t]) => `<li><em>${m}</em>${t}</li>`).join(''), k = Math.max(0, (.46 - ev.ndvi) / .08);
    const linea = ys => ys.map((y, i) => `${i ? 'L' : 'M'}${i * 25} ${Math.min(48, Math.round(y * 10) / 10)}`).join(' ');
    $('salidas').querySelectorAll('.salida').forEach(x => x.remove());
    $('salidas').insertAdjacentHTML('beforeend', `
      <div class="salida"><span class="c">Aviso a tu equipo</span><b>Orden de trabajo de hoy</b>
        <ul class="lista">${li(s.equipo.length ? s.equipo.map(t => ['→', t]) : [['·', 'Nada que mandar hoy']])}</ul>
        <span class="pie">${s.equipo.length ? 'enviado al móvil del encargado · 08:16' : 'sin avisos'}</span></div>
      <div class="salida"><span class="c">Plan de riego</span><b>Esta semana, por sector</b>
        <div class="riego">${s.riego.map((h, i) => `<i${i === s.w ? ' class="w"' : ''} style="--h:${h}%"><span>S${i + 1}</span></i>`).join('')}</div>
        <span class="pie">${s.riegoPie}</span></div>
      <div class="salida"><span class="c">Cuaderno digital</span><b>Registro al día</b><ul class="lista">${li(s.cuaderno)}</ul></div>
      <div class="salida"><span class="c">Para tu asesor</span><b>${s.asesor}</b>
        <svg class="spark" viewBox="0 0 200 50" aria-hidden="true"><path class="m" d="${linea(MEDIA)}"/><path class="s" d="${linea(MEDIA.map((y, i) => y + SEP[i] * k))}"/></svg>
        <span class="pie">${s.medida} · ${s.envia ? ev.refs.length + ' pruebas · enviado 08:15' : 'sin cambios · no se envía'}</span></div>`);
    if (on) $('salidas').querySelectorAll('.salida').forEach(x => x.classList.add('on'));
  }
  // con la historia ya contada, mover el escenario o la causa lo recalcula todo al momento
  function aplicar() {
    EV = evaluar(); P.hecho = false;
    ponerFuentes(EV); ponerCifras(EV); ponerCercado(EV); ponerCausa(); $('frase').textContent = EV.frase;
    $('pasos').setAttribute('aria-live', 'off'); estado(EV.dec.ok ? 'todo en rango' : 'acción propuesta', false);
    const ia = document.querySelector('.ia'); ia.classList.add('vivo'); ia.scrollTop = 0;
    $('pasos').innerHTML = EV.pasos.map(([t, refs], i) => `<li class="on">${paso(t, refs, i)}</li>`).join('');
    ponerDecision(EV); $('decision').classList.add('on'); ponerSalidas(EV, true); hot(EV.refs); redraw();
  }

  // ---- línea de tiempo ----
  let timers = [], alzar = null;
  let rapido = false;
  const at = (ms, fn) => timers.push(setTimeout(fn, quieto || rapido ? 0 : ms));
  function encender(k) {
    E.on.add(k); const f = FUENTES[k];
    if (f.obj) { f.o.g.visible = true; } else f.el.classList.add('on');
  }
  function estado(t, run) { $('st').innerHTML = '<i></i>' + t; $('st').classList.toggle('run', run); }
  function hot(keys) {
    E.hot = new Set(keys);
    Object.entries(FUENTES).forEach(([k, f]) => { if (!f.obj) f.el.classList.toggle('hot', E.hot.has(k)); });
    const c = keys.map(k => FUENTES[k]).find(f => !f.obj);
    if (c && cards.scrollHeight > cards.clientHeight + 4) cards.scrollTo({top:c.el.offsetTop - cards.offsetTop - 30, behavior:quieto ? 'auto' : 'smooth'});
  }
  function play(saltar) {
    timers.forEach(clearTimeout); timers = []; clearInterval(alzar); rapido = !!saltar;
    U.sel = null; tip.classList.remove('on'); if (!saltar) vistaInicial(); $('saltar').hidden = !!saltar;
    E.on.clear(); hot([]); E.alzado = 0; E.final = false; E.razona = false;
    Object.values(FUENTES).forEach(f => { if (f.obj) { if (f.o.g !== sat) f.o.g.visible = false; } else f.el.classList.remove('on'); });
    sat.visible = false;
    EV = evaluar(); P.hecho = false; ponerFuentes(EV); ponerCifras(EV); ponerCercado(EV); ponerCausa(); ponerDecision(EV); ponerSalidas(EV, false);
    $('causa-box').hidden = true; $('pasos').setAttribute('aria-live', 'polite'); document.querySelector('.ia').classList.remove('vivo');
    $('pasos').innerHTML = ''; $('decision').classList.remove('on');
    document.querySelector('.ia').scrollTop = 0; cards.scrollTop = 0;
    $('salidas').classList.remove('on');
    estado('conectando fuentes y sensores', true);
    ORDEN.forEach((k, i) => at(300 + i * 200, () => { encender(k); if (k === 'sat') sat.visible = true; }));
    at(3700, () => { estado('construyendo el mapa de la finca', true);
      if (quieto || rapido) E.alzado = 1; else alzar = setInterval(() => { E.alzado = Math.min(1, E.alzado + .025); if (E.alzado >= 1) clearInterval(alzar); }, 30); });
    at(5200, () => { estado('cruzando fuentes', true); E.razona = true; });
    EV.pasos.forEach(([t, refs], i) => at(5500 + i * 1900, () => {
      hot(refs);
      const li = document.createElement('li'); li.innerHTML = paso(t, refs, i);
      $('pasos').appendChild(li); requestAnimationFrame(() => li.classList.add('on'));
      const ia = document.querySelector('.ia'); ia.scrollTo({top:ia.scrollHeight, behavior:quieto ? 'auto' : 'smooth'});
    }));
    at(5500 + EV.pasos.length * 1900 + 300, () => {
      hot(EV.refs); E.final = true;
      $('decision').classList.add('on'); estado(EV.dec.ok ? 'todo en rango' : 'acción propuesta', false);
      $('frase').textContent = EV.frase; $('causa-box').hidden = false;
      const ia = document.querySelector('.ia'); setTimeout(() => ia.scrollTo({top:$('decision').offsetTop - ia.offsetTop - 14, behavior:quieto ? 'auto' : 'smooth'}), 200);
      $('salidas').classList.add('on'); $('saltar').hidden = true;
      if (!U.on) pista(fino ? 'Arrastra para moverte · Mayús + arrastrar gira' : 'Toca un punto · dos dedos mueven y giran');
      document.querySelectorAll('.salida').forEach((x, i) => setTimeout(() => x.classList.add('on'), quieto || rapido ? 0 : 500 + i * 350));
    });
  }

  let s = 8 * 3600 + 14 * 60 + 7;
  setInterval(() => { s++; const h = String(Math.floor(s / 3600) % 24).padStart(2, '0'), m = String(Math.floor(s / 60) % 60).padStart(2, '0'), x = String(s % 60).padStart(2, '0'); $('reloj').textContent = `${h}:${m}:${x}`; }, 1000);
  $('decision').addEventListener('click', e => {
    const b = e.target.closest('.btn'); if (!b) return; const a = EV.dec.acc[+b.dataset.i];
    $('toast').textContent = '✓ ' + a.toast; if (a.p) { P.hecho = true; ponerFase(); }
  });
  // escenarios (también con 1 2 3) y la causa
  function elegirEsc(k) {
    if (!ESC[k] || (k === P.esc && E.final)) return;
    P.esc = k; P.v = ESC[k].v;
    document.querySelectorAll('#escs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.esc === k));
    avisa('ig-esc-' + k); if (window.parent !== window) parent.postMessage({ig:'esc', esc:k}, location.origin);
    if (E.final) aplicar(); else play(true);
  }
  document.querySelectorAll('#escs button').forEach(b => b.addEventListener('click', () => elegirEsc(b.dataset.esc)));
  addEventListener('keydown', e => { if (!e.ctrlKey && !e.metaKey && !e.altKey && ['1', '2', '3'].includes(e.key)) elegirEsc(Object.keys(ESC)[+e.key - 1]); });
  let movida = false;
  $('causa').addEventListener('input', e => { P.v = +e.target.value; if (!movida) { movida = true; avisa('ig-causa'); } aplicar(); });
  { const k = new URLSearchParams(location.search).get('esc');
    if (ESC[k]) { P.esc = k; P.v = ESC[k].v; document.querySelectorAll('#escs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.esc === k)); } }
  $('again').addEventListener('click', () => play());
  $('saltar').addEventListener('click', () => play(true));

  resize(); metaHistoria(0); Object.assign(C, G); placeCam(0);
  if (!quieto) requestAnimationFrame(frame); else { running = false; }
  let hecho = false;
  const go = () => { if (!hecho) { hecho = true; play(); if (quieto) setTimeout(() => { placeCam(0); draw(); }, 50); } };
  const enPortada = window.parent !== window;
  if (enPortada) {
    addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.ig === 'empieza') go(); });
    // la altura del contenido, no la del marco (scrollHeight nunca baja de la altura del propio marco)
    const caja = document.querySelector('.wrap');
    const altura = () => parent.postMessage({ig:'altura', h:Math.ceil(caja.getBoundingClientRect().height)}, location.origin);
    new ResizeObserver(altura).observe(caja); altura();
  } else {
    if ('IntersectionObserver' in window) new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) go(); }, {threshold:.2}).observe(escena);
    setTimeout(go, 1200);
  }
})();
</script>
